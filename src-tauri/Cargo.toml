[package]
name = "hb-continuum"
version = "0.4.0-beta"
description = "HB Continuum desktop shell"
edition = "2021"

[lib]
name = "hb_continuum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
