name: Feature request
description: Propose a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead? Keep it small and concrete.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy and security impact
      description: |
        Required. Does this add network access, telemetry, new dependencies,
        credential handling, or write data outside the encrypted database? Say
        "none" if it genuinely does not.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, workarounds or simpler options.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This request does not require telemetry, a mandatory cloud service or a silent credential fallback.
          required: true
