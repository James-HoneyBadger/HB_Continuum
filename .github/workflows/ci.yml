name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile dispatch.py desktop.py schedule.py schedule_ui.py sync_lock.py tests/test_dispatch.py tests/test_schedule.py preferences.py preferences_ui.py tests/test_preferences.py research.py research_ui.py tests/test_research.py backup.py mime_index.py tests/test_hardening.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install mypy==2.4.1
      - name: Type check
        run: mypy
