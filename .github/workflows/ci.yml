name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile dispatch.py desktop.py schedule.py schedule_ui.py sync_lock.py schedulers.py tests/test_dispatch.py tests/test_schedule.py tests/test_schedulers.py preferences.py preferences_ui.py tests/test_preferences.py research.py research_ui.py tests/test_research.py search_worker.py tests/test_search_worker.py catalog.py facebook.py tests/test_facebook.py summarize.py tests/test_summarize.py unified.py tests/test_unified.py ipc.py tests/test_ipc.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install mypy==2.4.1
      - name: Type check
        run: mypy
