name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile dispatch.py desktop.py schedule.py schedule_ui.py sync_lock.py schedulers.py migrations.py timestamps.py mime_index.py backup.py tests/test_dispatch.py tests/test_schedule.py tests/test_schedulers.py tests/test_migrations.py tests/test_hardening.py tests/test_timeline.py tests/test_concurrency.py tests/test_import_runs.py preferences.py preferences_ui.py tests/test_preferences.py research.py research_ui.py tests/test_research.py search_worker.py tests/test_search_worker.py catalog.py facebook.py tests/test_facebook.py summarize.py tests/test_summarize.py unified.py tests/test_unified.py ipc.py tests/test_ipc.py scripts/scheduler_smoke.py scripts/build_engine.py
      - name: Tests
        run: python -m unittest discover -s tests -v

  scheduler:
    name: scheduler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install, inspect and remove a real scheduler entry
        run: python scripts/scheduler_smoke.py

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build and smoke-test the bundled engine
        run: python scripts/build_engine.py --no-copy --smoke

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mypy
        run: pip install mypy==2.4.1
      - name: Type check
        run: mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build and type-check frontend
        run: npm run build
