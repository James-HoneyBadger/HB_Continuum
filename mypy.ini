[mypy]
python_version = 3.12
files = dispatch.py, desktop.py, schedule.py, schedule_ui.py, sync_lock.py, preferences.py, preferences_ui.py, research.py, research_ui.py, search_worker.py, catalog.py, facebook.py, summarize.py, unified.py

; The codebase is intentionally unannotated, so check_untyped_defs stays off:
; enabling it reports 21 inference artefacts (tuple reassignment, tkinter
; widget unions) rather than defects. Turn it on once annotations exist.
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
